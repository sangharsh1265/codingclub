<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coding club</title>
</head>
<body>
    <nav>
        <a href="#events">Upcoming Events</a> |
        <a href="#Register">Register</a>
    </nav>

    <h1>Coding Club</h1>
    <h2 id="events">Upcoming Event</h2>

    <table border="2px">
        <caption>Club Events</caption>

        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>
        <tr>
            <td>HTML Workshop</td>
            <td>12Nov</td>
            <td>Lab 1</td>
        </tr>
        <tr>
            <td>Hackathon</td>
            <td>20Nov</td>
            <td>Seminar Hall</td>
        </tr>
        <tr>
            <td colspan="3">Total events: 2</td>
        </tr>
    </table>

    <h2 id="Register">Register for Events</h2>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name">

    <br><br>

    <label for="Email">Email address:</label>
    <input type="email" id="email" name="email" placeholder="Enter your Email">

    <br><br>


    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your Password">

    <br><br>


    <label for="DOB">Date of Birth:</label>
    <input type="date" id="DOB" name="DOB">

    <br><br>


    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone">

    <br><br>

    
    <label for="male: ">Gender:</label>
    <input type="radio" id="male" name="Gender" value="male" required>Male

    <label for="female"></label>
    <input type="radio" id="female" name="Gender" value="female" required>Female

    <br>    <br>

    <label for="Web">Intrests</label>
    <input type="checkbox" id="Web" name="Intrests" value="Web">Web

    <label for="DSA"></label>
    <input type="checkbox" id="DSA" name="Intrests" value="DSA">DSA

    <br><br>

    <label for="courses">Course: </label>
    <select id="course">
        <option value="">--course--</option>
        <option value="B.A">B.A</option>
        <option value="B.Sc">B.Sc</option>
        <option value="B.Com">B.Com</option>
        <option value="B.Tech">B.Tech</option>
        <option value="BCA">BCA</option>
        <option value="MCA">MCA</option>
    </select>

    <br><br>

    <label for="question">Why do you want to join</label>
    <textarea row="5" column="30"></textarea>

    <br><br>
    
    <button>Register</button>

</body>
</html>
